services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: realestate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-real_estate_due_diligence}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tiger}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db_script:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-real_estate_due_diligence}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - realestate-net

  # Spring Boot Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: realestate-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-real_estate_due_diligence}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-tiger}
      APPLICATION_SECURITY_JWT_SECRET_KEY: ${JWT_SECRET:-dGVzdHNlY3JldGtleWZvcmhlbHBpbmdidWlsZGluZ3RoZXJlYWxlc3RhdGVkdWVkaWxpZ2VuY2VwbGF0Zm9ybQ==}
      APPLICATION_SECURITY_JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    networks:
      - realestate-net

  # React Frontend (Nginx)
  frontend:
    build:
      context: ./frontend/real-estate-frontend
      dockerfile: Dockerfile
    container_name: realestate-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://backend:8081
    ports:
      - "5174:80"
      - "80:80"
    networks:
      - realestate-net

volumes:
  postgres_data:
    driver: local

networks:
  realestate-net:
    driver: bridge
